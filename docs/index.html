<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>MORNING RESEARCH MAGAZINE</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- 상단 헤더 -->
    <header class="topbar">
      <div class="brand-row">
        <div class="brand">
          <span class="brand-badge">DAILY PICK</span>
          <h1>MORNING RESEARCH</h1>
        </div>
        <div class="header-actions">
          <select id="dateSelect" class="date-select" aria-label="날짜 선택"></select>
          <button id="themeToggle" class="icon-btn" aria-label="테마 전환" title="다크/라이트 모드">🌙</button>
        </div>
      </div>
      <p id="metaSubtitle" class="subtitle">데이터를 불러오는 중...</p>
    </header>

    <!-- Pick 탭 네비게이션 -->
    <nav id="pickTabs" class="pick-tabs" aria-label="오늘의 리포트 선택"></nav>

    <!-- 메인 아티클 컨테이너 -->
    <main id="articleContainer" class="article-container">
      <div class="loading-card">
        <div class="spinner"></div>
        <p>오늘의 리포트를 준비하고 있습니다...</p>
      </div>
    </main>
  </div>

  <!-- 차트 풀스크린 확대 모달 -->
  <div id="lightboxModal" class="lightbox hidden" role="dialog" aria-modal="true">
    <div class="lightbox-bar">
      <span id="lightboxCaption">차트 확대 보기 (두 손가락으로 확대 가능)</span>
      <button id="lightboxClose" class="lightbox-close" aria-label="닫기">✕</button>
    </div>
    <div class="lightbox-body">
      <img id="lightboxImg" src="" alt="확대 차트" />
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
